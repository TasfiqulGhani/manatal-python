[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manatal"
version = "0.1.4"
description = "Python SDK for Manatal, an AI-powered ATS — simple Open API auth, pagination, and retries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Tasfiqul Ghani" },
]
keywords = ["manatal", "ats", "ai-powered ats", "recruiting", "hr", "hris", "api", "sdk", "openapi", "candidates", "jobs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/TasfiqulGhani/manatal-python"
Documentation = "https://developers.manatal.com/reference/getting-started"
"Open API guide" = "https://support.manatal.com/docs/manatal-api"
Manatal = "https://app.manatal.com/"
Issues = "https://github.com/TasfiqulGhani/manatal-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manatal"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
